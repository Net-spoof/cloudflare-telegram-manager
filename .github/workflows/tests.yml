name: Offline Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install 'cryptography==44.0.2'
      - name: Run offline regressions
        run: |
          python test_auth.py
          python test_account_connection.py
          python test_callback_encoding.py
          python test_interface.py
          python test_account_commands.py
          python test_command_menu.py
          python test_i18n.py
          python - <<'PY'
          from pathlib import Path
          assert all(p in Path('Dockerfile').read_text() for p in ('i18n.py', 'locales.json'))
          print('PASS: Docker image includes the localization files')
          PY
