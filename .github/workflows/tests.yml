name: Offline Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install 'cryptography==44.0.2'
      - name: Run offline regressions
        run: |
          python test_auth.py
          python test_v25.py
          python test_v26.py
          python test_v27.py
